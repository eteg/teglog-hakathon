name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Nunca cancelar um deploy/migração no meio; enfileira.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint e typecheck
        run: npm run lint && npm run typecheck && npm test

      - name: Build do Worker (OpenNext)
        run: npm run cf:build

      - name: Aplicar migrações D1
        run: npm run db:migrate:remote

      - name: Deploy
        run: npx opennextjs-cloudflare deploy

      - name: Smoke test /api/health
        if: ${{ vars.APP_URL != '' }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.APP_URL }}/api/health"; then exit 0; fi
            sleep 5
          done
          echo "::error::/api/health não respondeu OK"
          exit 1
