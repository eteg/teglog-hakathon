name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Migrations em sincronia com db/schema.ts
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::db/schema.ts mudou sem migração. Rode 'npm run db:generate' e commite db/migrations."
            git status --porcelain db/migrations
            exit 1
          fi

      - name: Migrations aplicam num D1 limpo
        run: npm run db:migrate:local

      - name: Build do Worker (OpenNext)
        run: npm run cf:build
